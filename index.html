<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="WIRL — IRL-стриминг с телефона." />
    <title>WIRL — IRL streaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&family=Google+Sans+Flex:opsz,wght@6..96,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="home-page">
    <main>
      <section class="hero">
        <div class="hero-title" aria-label="WIRL">
          <svg viewBox="0 0 1200 330" role="img" aria-label="WIRL">
            <defs><linearGradient id="wirlGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aaff00"/><stop offset=".52" stop-color="#8dff00"/><stop offset="1" stop-color="#b4ff36"/></linearGradient></defs>
            <text x="50%" y="78%" text-anchor="middle">WIRL</text>
          </svg>
        </div>
        <a class="download-button glow-green" href="download.html" data-i18n="download">Загрузить</a>
        <span class="hero-scroll" aria-hidden="true">↓</span>
      </section>

      <section class="showcase" aria-label="WIRL features">
        <!-- VIDEO SLOT 1: put your file in assets/videos/ and replace data-video below. -->
        <article class="showcase-row row-right">
          <div class="video-frame glow-green">
            <video class="feature-video" playsinline controls preload="metadata" data-video="assets/videos/wide-camera.mp4"></video>
            <div class="video-placeholder" data-i18n="videoPlaceholder">Здесь будет ваше видео</div>
          </div>
          <h2 data-i18n="wideCamera">Поддержка<br />широкоугольной камеры</h2>
        </article>

        <!-- VIDEO SLOT 2: replace assets/videos/browser-sources.mp4 with your own clip. -->
        <article class="showcase-row row-left">
          <h2 data-i18n="browserSources">Источники<br />браузера</h2>
          <div class="video-frame glow-purple">
            <video class="feature-video" playsinline controls preload="metadata" data-video="assets/videos/browser-sources.mp4"></video>
            <div class="video-placeholder" data-i18n="videoPlaceholder">Здесь будет ваше видео</div>
          </div>
        </article>

        <!-- VIDEO SLOT 3: replace assets/videos/twitch.mp4 with your own clip. -->
        <article class="showcase-row row-right">
          <div class="video-frame glow-purple">
            <video class="feature-video" playsinline controls preload="metadata" data-video="assets/videos/twitch.mp4"></video>
            <div class="video-placeholder" data-i18n="videoPlaceholder">Здесь будет ваше видео</div>
          </div>
          <h2 data-i18n="twitchIntegration">Интеграция<br />с Twitch</h2>
        </article>

        <!-- VIDEO SLOT 4: replace assets/videos/traffic.mp4 with your own clip. -->
        <article class="showcase-row row-left">
          <h2 data-i18n="traffic">Следи за<br />трафиком</h2>
          <div class="video-frame glow-red">
            <video class="feature-video" playsinline controls preload="metadata" data-video="assets/videos/traffic.mp4"></video>
            <div class="video-placeholder" data-i18n="videoPlaceholder">Здесь будет ваше видео</div>
          </div>
        </article>
      </section>

      <section class="bottom-wordmark" aria-label="WIRL"><span>WIRL</span></section>
      <button class="language-toggle" type="button" aria-label="Change language">EN</button>
    </main>
    <script src="site.js"></script>
  </body>
</html>
